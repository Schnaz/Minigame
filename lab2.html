<body style="display: grid; justify-content: center; background-color: #999999;">
<!-- The canvas element where WebGL will draw -->
<canvas id="Canvas" width="640" height="640"></canvas>
<br>
<div style="text-align: center;">
<button onclick="spd+=0.2;">Increase</button>
<button onclick="if (spd>0.1) spd-=0.2;">Decrease</button>
<button onclick="rot=true;">StartRotate</button>
<button onclick="rot=false;">StopRotate</button>
</div>
